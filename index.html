    <!--
      Compatibilidad de enlaces. El comic usaba rutas de hash con barra
      (#/proyectos); la pagina unica usa anclas normales (#proyectos).
      Esto traduce las viejas antes de que monte React, para que un enlace
      ya compartido (CV, LinkedIn) siga cayendo donde debe.
    -->
    <script>
      (function () {
        var h = window.location.hash;
        if (h.indexOf("#/") === 0) {
          window.location.replace(h.replace("#/", "#"));
        }
      })();
    </script>

    <!--
      LCP: la foto del hero es el elemento mas grande de la primera pantalla. Sin esta
      precarga el navegador solo la descubre cuando ejecuta el bundle de JS (medido en
      movil, CPU 4x y Fast 4G: 1062 ms de retraso de carga). `type` evita bajar el AVIF en
      navegadores que no lo soportan: ahi <picture> elige el WebP. Misma URL que el
      <source> de Hero.tsx; si cambia una, cambia la otra.
    -->
    <link
      rel="preload"
      as="image"
      href="/media/img/anthony.avif"
      type="image/avif"
      fetchpriority="high"
    />

    <!--
      Anton es la unica critica: es el titulo del hero y por tanto el LCP.
      El resto entra con swap para no bloquear el primer render.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Anton&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <!--
      Yuji Syuku SUBSETEADA. Sin `text=`, Google particiona la fuente en 123
      woff2 por unicode-range y los kanji/kana de este sitio caen en 21 chunks
      distintos: 554 KB en 21 peticiones — mas que todo el JS de la app — para
      pintar unos titulos y tres onomatopeyas. Con `text=` es 1 peticion de ~21 KB.

      OJO AL EDITAR: si anades un kanji, katakana o SFX nuevo (campos `jp`,
      `numeral` de meta.ts, `pow` de projects.ts/timeline.ts, o `kana` de un
      <Sfx>), TIENES que regenerar esta lista o el glifo nuevo caera en silencio
      al fallback. El test src/test/font-subset.test.ts falla si eso ocurre.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&text=!.ABFHLMOPSUWZceijlmnoprstw%7B%7D%C2%A1%C3%91%E3%82%A2%E3%82%AF%E3%82%B6%E3%82%BD%E3%83%83%E3%83%89%E3%83%8B%E3%83%91%E3%83%B3%E3%83%BC%E4%B8%80%E4%B8%83%E4%B8%89%E4%BA%8C%E4%BA%94%E4%BB%8B%E4%BB%96%E4%BD%9C%E5%85%AB%E5%85%AD%E5%85%B6%E5%86%86%E5%93%81%E5%9B%9B%E5%AE%9F%E5%B7%B1%E5%B8%B8%E5%BA%8F%E6%88%A6%E6%8A%80%E6%94%BE%E6%97%A5%E6%B5%AA%E7%9B%B8%E7%A8%8B%E7%B4%B9%E7%B5%82%E7%B5%A1%E8%87%AA%E9%80%A3%E9%81%93&display=swap"
